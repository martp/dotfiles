# Active line — left side
format = """
$directory$git_branch$git_status$cmd_duration
$character"""

# Active line — right side
right_format = """$time"""

[time]
disabled = false
format = "[$time]($style)"
style = "bold #565f89"
time_format = "%H:%M"

[directory]
style = "bold #7aa2f7"
truncation_length = 3
truncate_to_repo = true
read_only = " "

[git_branch]
symbol = " "
style = "bold #bb9af7"
format = "  [$symbol$branch]($style)"

[git_status]
format = '( [$all_status$ahead_behind]($style))'
style = "bold #e0af68"
conflicted = "="
ahead    = "⇡${count}"
behind   = "⇣${count}"
diverged = "⇕"
modified = "!${count}"
untracked = "?${count}"
staged   = "+${count}"
deleted  = "✗${count}"
stashed  = "≡"
renamed  = "»"

[cmd_duration]
min_time = 2000
format = "  [$duration](bold #565f89)"

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol   = "[❯](bold #f7768e)"
vicmd_symbol   = "[❮](bold #bb9af7)"

[nodejs]
symbol = " "
detect_files = ["package.json", ".node-version"]
format = "  [$symbol($version)]($style)"
style = "bold #9ece6a"

[bun]
symbol = "🍞 "
format = "  [$symbol($version)]($style)"
style = "bold #e0af68"
